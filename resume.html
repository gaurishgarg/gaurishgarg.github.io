<script>
    var toflip = true;
    const container = document.getElementById("container");
    const bookWidth = container.clientWidth;
    const bookHeight = bookWidth * 1.4;  // maintain ratio
    const pagepaths = ["1767858605024glance.html", "1767858614085esparq.html", "1767858771050anmol.html", "1767858648577atm.html", "1767858631099spatial.html", "1767851682675blank.html"];
    const pageFlip = new St.PageFlip(document.getElementById("flipbook"), {
      width: bookWidth,
      height: bookHeight,
       size: "stretch",  
        minWidth: 315,
        minHeight: 400,
        maxWidth: 2000,
        maxHeight: 3000,
        drawshadow: true,
        showFoldShadow: true,
        mobileScrollSupport: true,

    });

 


    async function loadPages() {
    pages = []

    for(let i=0;i<pagepaths.length;i++){

      let base = "static/uploads/html/1.html";
        base = base.replace("1.html", "");        
        let url = base + pagepaths[i];
        console.log(url);



        // let response = await fetch(url);
        // let html = await response.text();


        let pageDiv = document.createElement("iframe");
        pageDiv.src = url;
        pageDiv.classList.add("page");
        // pageDiv.innerHTML = html;

        pages.push(pageDiv);
    }

      
    

    pageFlip.loadFromHTML(pages);
    
}
  
function toggleFlip() {
  const isOn = document.getElementById("btn-toggle").checked;
  console.log("Auto Flip:", isOn ? "ON" : "OFF");
  if(isOn){
    toflip = true;
    document.getElementById("autolabel").innerText = "Manual Flip";
  }
  else{
    toflip = false;
    document.getElementById("autolabel").innerText = "Auto Flip";

  }


}
function flippage(){
  if(toflip){
  pageFlip.flipNext();
  }
}

function flipnext(){
      pageFlip.flipNext();

}
function flipprev(){
      pageFlip.flipPrev();

}

   loadPages()
    window.addEventListener("resize", () => pageFlip.update());

// window.setInterval(flippage,3000);
</script>
